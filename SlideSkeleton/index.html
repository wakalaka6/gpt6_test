<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Skeleton Benchmark · Human × GPT-6</title>
<style>
:root{color-scheme:light;--ink:#202523;--muted:#808783;--line:#e7eae8;--green:#44735c}
*{box-sizing:border-box}body{margin:0;background:#f4f5f4;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}
button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:4px}
.shell{max-width:2200px;margin:auto;padding:36px 32px 60px}.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:0 16px 26px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}h1{font:600 clamp(30px,3.5vw,55px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-1.8px;margin:9px 0 12px}.subtitle{color:var(--muted);margin:0}.stats{display:flex;gap:34px;text-align:right;white-space:nowrap}.stats strong{display:block;font-size:22px;font-weight:600}.stats span{font-size:12px;color:var(--muted)}
main{background:white;border:1px solid var(--line);border-radius:4px;box-shadow:0 3px 20px #20252303}.toolbar{padding:18px 22px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar label{font-size:12px;color:var(--muted)}input,select{border:1px solid #dfe3e0;border-radius:4px;background:white;color:var(--ink);padding:9px 12px}input{width:250px}input:focus,select:focus{outline:2px solid #bbd1c3;outline-offset:1px}.hint{margin-left:auto;font-size:12px;color:var(--muted)}.comparison{overflow-x:auto}.rows{min-width:900px}.style-row{padding:0 20px 22px;border-bottom:1px solid var(--line)}.style-row:last-child{border-bottom:0}.row-heading{display:flex;align-items:center;gap:12px;padding:20px 2px 17px}.row-id{font:12px Georgia,serif;color:var(--green)}h2{font-size:16px;font-weight:600;margin:0}.row-note{margin-left:auto;color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.deck{min-width:0;padding:0 16px;display:flex;flex-direction:column;border-right:1px dashed var(--line)}.deck:first-child{padding-left:0}.deck:last-child{padding-right:0;border-right:0}.deck-heading{display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 15px}.model-tag{font-size:9px;letter-spacing:.5px;background:#edf3ef;color:var(--green);padding:2px 5px;border-radius:3px;font-weight:500}.preview{display:block;padding:0;border:0;background:#f5f6f5;width:100%;line-height:0;cursor:zoom-in;border-radius:2px;overflow:hidden}.preview img{width:100%;height:auto;display:block}.preview:hover{outline:2px solid #bbd1c3;outline-offset:3px}.source{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:12px 0 10px}.deck-footer{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}.page-count{margin-right:auto}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#69977a;margin-right:5px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}[hidden]{display:none!important}.bottom{display:flex;justify-content:space-between;margin:17px 2px;font-size:11px;color:var(--muted)}
dialog{border:1px solid #ddd;border-radius:6px;padding:0;width:min(1500px,94vw);max-width:94vw;max-height:94vh;background:#fff;color:var(--ink)}dialog::backdrop{background:#17211bcc;backdrop-filter:blur(3px)}.modal-bar{display:flex;align-items:center;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line)}.modal-bar strong{margin-right:auto;font-size:14px}.modal-bar a{font-size:12px}.close{border:1px solid #ddd;background:white;border-radius:4px;padding:5px 10px}.modal-body{overflow:auto;max-height:calc(94vh - 66px);padding:20px;background:#f5f6f5;text-align:center}.modal-body img{display:block;max-width:100%;height:auto;margin:auto;cursor:zoom-in}.modal-body img.full{max-width:none;cursor:zoom-out}.modal-tip{color:var(--muted);font-size:11px}
@media(max-width:760px){.shell{padding:22px 12px}.masthead{margin:0 4px 22px;display:block}.stats{margin-top:20px;gap:26px;text-align:left}.stats strong{font-size:18px}.toolbar{padding:14px;gap:8px}input{width:185px}.hint{width:100%;margin-left:0}.subtitle{font-size:12px}.modal-tip{display:none}.bottom{display:block}.bottom span{display:block}h1{letter-spacing:-1px}}
.heading-pages{font-size:11px;font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
 <header class="masthead">
  <div><div class="eyebrow">TEMPLATE BENCHMARK</div><h1>Slide Skeleton Comparison</h1><p class="subtitle">同一风格下的人类设计与模型生成 · Human × GPT-6</p></div>
  <div class="stats"><div><strong id="style-total"></strong><span>测试风格</span></div><div><strong id="human-total"></strong><span>Human 模板</span></div><div><strong id="model-total"></strong><span>GPT-6 模板</span></div></div>
 </header>
 <main>
  <div class="toolbar"><label for="search">查找</label><input id="search" type="search" placeholder="风格名称或编号" autocomplete="off"><label for="style">显示</label><select id="style"><option value="all">全部风格</option></select><span class="hint" id="result-count" aria-live="polite"></span><span class="hint">完整页面总览 · 点击图片放大</span></div>
  <div class="comparison"><div class="rows" id="rows"></div></div><div class="empty" id="empty" hidden>没有匹配的风格，请调整筛选条件。</div>
 </main>
 <footer class="bottom"><span>列顺序：Human 02 · Human 03 · Human 01 · GPT-6</span><span>第 3、4 列为页数相同的 Human 参考与 GPT-6 预测。</span></footer>
</div>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="modal-bar"><strong id="viewer-title"></strong><span class="modal-tip">点击图片切换原始尺寸 · Esc 关闭</span><a id="viewer-original" target="_blank" rel="noopener">原图 ↗</a><button type="button" class="close" id="close">关闭 ×</button></div><div class="modal-body"><img id="viewer-image" alt=""></div></dialog>
<script>
const data=[{"id": "01", "style": "大胆撞色", "decks": [{"label": "Human 02", "image": "01/human_02/overview.png", "pages": 28, "source": "Colorful Geometric Company Founder About Me Creative Presentation · SlidesCarnival"}, {"label": "Human 03", "image": "01/human_03/overview.png", "pages": 29, "source": "Blue Yellow and Red Geometric Math Creative Presentation · SlidesCarnival"}, {"label": "Human 01", "image": "01/human/overview.png", "pages": 24, "source": "Multicolored Geometric Modern Pitch Deck Video Business Presentation"}, {"label": "GPT-6", "image": "01/generated/overview.png", "pages": 24, "source": "gpt-6-astra"}]}, {"id": "02", "style": "未来科技", "decks": [{"label": "Human 02", "image": "02/human_02/overview.png", "pages": 18, "source": "Futuristic Engineering Center Modern Presentation"}, {"label": "Human 03", "image": "02/human_03/overview.png", "pages": 22, "source": "Blue and Green Modern Tech Branding Kit Presentation"}, {"label": "Human 01", "image": "02/human/overview.png", "pages": 34, "source": "Black and Blue Tech Theme for Career Day Presentation"}, {"label": "GPT-6", "image": "02/generated/overview.png", "pages": 34, "source": "gpt-6-astra"}]}, {"id": "03", "style": "蓝白商务", "decks": [{"label": "Human 02", "image": "03/human_02/overview.png", "pages": 26, "source": "Blue and White Corporate Illustrated Blue Connections Presentation"}, {"label": "Human 03", "image": "03/human_03/overview.png", "pages": 8, "source": "McKinsey Consulting Report Slides"}, {"label": "Human 01", "image": "03/human/overview.png", "pages": 21, "source": "Blue and White Simple Basic Company Roadmap Presentation"}, {"label": "GPT-6", "image": "03/generated/overview.png", "pages": 21, "source": "gpt-6-astra"}]}, {"id": "04", "style": "粉色极简", "decks": [{"label": "Human 02", "image": "04/human_02/overview.png", "pages": 26, "source": "Self Care Green and Pink Newsletter Elegant Minimal Pastel Presentation"}, {"label": "Human 03", "image": "04/human_03/overview.png", "pages": 23, "source": "Minimal Photo Centric Breast Cancer Awareness Month Presentation"}, {"label": "Human 01", "image": "04/human/overview.png", "pages": 23, "source": "Pink and Gray Modern Minimalistic Aesthetic Beauty Vlogger CV Marketing Presentation"}, {"label": "GPT-6", "image": "04/generated/overview.png", "pages": 23, "source": "gpt-6-astra"}]}, {"id": "05", "style": "黑白极简", "decks": [{"label": "Human 02", "image": "05/human_02/overview.png", "pages": 22, "source": "Minimalist Grayscale Pitch Deck Presentation"}, {"label": "Human 03", "image": "05/human_03/overview.png", "pages": 19, "source": "Elegant Minimal Rich Media Slides"}, {"label": "Human 01", "image": "05/human/overview.png", "pages": 25, "source": "Black And White Minimal Architecture Portfolio Presentation"}, {"label": "GPT-6", "image": "05/generated/overview.png", "pages": 25, "source": "gpt-6-astra"}]}, {"id": "06", "style": "霓虹复古", "decks": [{"label": "Human 02", "image": "06/human_02/overview.png", "pages": 20, "source": "Computer Engineering Technology Presentation "}, {"label": "Human 03", "image": "06/human_03/overview.png", "pages": 26, "source": "Pink and Teal Illustrative Creative 90's Style Presentation"}, {"label": "Human 01", "image": "06/human/overview.png", "pages": 17, "source": "Retro Posting Signs Newsletter "}, {"label": "GPT-6", "image": "06/generated/overview.png", "pages": 17, "source": "gpt-6-astra"}]}, {"id": "07", "style": "自然植物", "decks": [{"label": "Human 02", "image": "07/human_02/overview.png", "pages": 15, "source": "Green and Pink Nature Watercolor Botanical Garden Spring Field Trip"}, {"label": "Human 03", "image": "07/human_03/overview.png", "pages": 24, "source": "Navy Beige Abstract Floral Arrangement Workshop_Class"}, {"label": "Human 01", "image": "07/human/overview.png", "pages": 28, "source": "Floral Drawings Slides · SlidesCarnival"}, {"label": "GPT-6", "image": "07/generated/overview.png", "pages": 28, "source": "gpt-6-astra"}]}, {"id": "08", "style": "可爱手绘", "decks": [{"label": "Human 02", "image": "08/human_02/overview.png", "pages": 28, "source": "Colorful Cute Simple Illustrative Doodles Funny About Me Creative Presentation · SlidesCarnival"}, {"label": "Human 03", "image": "08/human_03/overview.png", "pages": 28, "source": "Yellow Blue and Red Cute Simple Illustrative Doodles Back-to-School Social Media Creative Presentation · SlidesCarnival"}, {"label": "Human 01", "image": "08/human/overview.png", "pages": 28, "source": "Red Blue and Yellow Cute Simple Illustrative Doodles Introducing Myself Creative Presentation · SlidesCarnival"}, {"label": "GPT-6", "image": "08/generated/overview.png", "pages": 28, "source": "gpt-6-astra"}]}, {"id": "09", "style": "金色优雅", "decks": [{"label": "Human 02", "image": "09/human_02/overview.png", "pages": 25, "source": "Elegant Gold Glamorous 50th Birthday Minitheme"}, {"label": "Human 03", "image": "09/human_03/overview.png", "pages": 21, "source": "Gold Arabic Culture Thesis Presentation"}, {"label": "Human 01", "image": "09/human/overview.png", "pages": 22, "source": "Gold Elegant Branding Kit Presentation"}, {"label": "GPT-6", "image": "09/generated/overview.png", "pages": 22, "source": "gpt-6-astra"}]}, {"id": "10", "style": "几何抽象", "decks": [{"label": "Human 02", "image": "10/human_02/overview.png", "pages": 21, "source": "Abstract Geometric Brainstorm Presentation"}, {"label": "Human 03", "image": "10/human_03/overview.png", "pages": 18, "source": "Modern Geometric Simple Brainstorm Presentation"}, {"label": "Human 01", "image": "10/human/overview.png", "pages": 17, "source": "Geometric History of Graphic Design Slides"}, {"label": "GPT-6", "image": "10/generated/overview.png", "pages": 17, "source": "gpt-6-astra"}]}];
const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('style-total').textContent=data.length;$('human-total').textContent=data.length*3;$('model-total').textContent=data.length;
for(const row of data){const option=document.createElement('option');option.value=row.id;option.textContent=`${row.id} ${row.style}`;$('style').append(option)}
$('rows').innerHTML=data.map(row=>`<section class="style-row" data-id="${row.id}" aria-labelledby="style-${row.id}"><div class="row-heading"><span class="row-id">STYLE ${row.id}</span><h2 id="style-${row.id}">${escapeHTML(row.style)}</h2><span class="row-note">3 HUMAN / 1 GPT-6</span></div><div class="grid">${row.decks.map((deck,i)=>`<article class="deck"><h3 class="deck-heading">${deck.label}<span class="heading-pages">${deck.pages} 页</span>${i===3?'<span class="model-tag">PREDICTED</span>':''}</h3><button class="preview" data-row="${row.id}" data-deck="${i}" aria-label="放大 ${escapeHTML(row.style)} ${deck.label} 骨架总览"><img src="${deck.image}" alt="${escapeHTML(row.style)} · ${deck.label} · ${deck.pages} 页骨架总览" loading="${row.id==='01'?'eager':'lazy'}" decoding="async"></button><p class="source" title="${escapeHTML(deck.source)}">${escapeHTML(deck.source)}</p><div class="deck-footer"><span class="page-count"><span class="dot"></span>${deck.pages} 页</span><a href="${deck.image}" target="_blank" rel="noopener">PNG ↗</a></div></article>`).join('')}</div></section>`).join('');
function filter(){const term=$('search').value.trim().toLowerCase(),style=$('style').value;let count=0;for(const row of data){const visible=(style==='all'||row.id===style)&&`${row.id} ${row.style}`.toLowerCase().includes(term);document.querySelector(`[data-id="${row.id}"]`).hidden=!visible;if(visible)count++}$('empty').hidden=count!==0;$('result-count').textContent=`${count} / ${data.length} 种风格`}
$('search').addEventListener('input',filter);$('style').addEventListener('change',filter);filter();
$('rows').addEventListener('click',event=>{const button=event.target.closest('.preview');if(!button)return;const row=data.find(r=>r.id===button.dataset.row),deck=row.decks[Number(button.dataset.deck)];$('viewer-title').textContent=`${row.id} ${row.style} / ${deck.label} · ${deck.pages} 页`;$('viewer-image').src=deck.image;$('viewer-image').alt=`${row.style} ${deck.label} 骨架总览`;$('viewer-image').classList.remove('full');$('viewer-original').href=deck.image;$('viewer').showModal();document.querySelector('.modal-body').scrollTo(0,0)});
$('close').addEventListener('click',()=>$('viewer').close());$('viewer').addEventListener('click',event=>{if(event.target===$('viewer'))$('viewer').close()});$('viewer-image').addEventListener('click',()=>{$('viewer-image').classList.toggle('full')});
</script>
</body>
</html>
