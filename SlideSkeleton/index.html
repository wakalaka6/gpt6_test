<!doctype html>
<html lang="zh-CN">
<head>

<title>Slide Benchmark · Human 与 AI 图文设计对比</title>
<style>
:root{color-scheme:light;--ink:#202523;--muted:#808783;--line:#e7eae8;--green:#44735c}
*{box-sizing:border-box}body{margin:0;background:#f4f5f4;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}
button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:4px}
.shell{max-width:2200px;margin:auto;padding:36px 32px 60px}.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:0 16px 26px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}h1{font:600 clamp(30px,3.5vw,55px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-1.8px;margin:9px 0 12px}.subtitle{color:var(--muted);margin:0}.stats{display:flex;gap:34px;text-align:right;white-space:nowrap}.stats strong{display:block;font-size:22px;font-weight:600}.stats span{font-size:12px;color:var(--muted)}
main{background:white;border:1px solid var(--line);border-radius:4px;box-shadow:0 3px 20px #20252303}.toolbar{padding:18px 22px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar label{font-size:12px;color:var(--muted)}input,select{border:1px solid #dfe3e0;border-radius:4px;background:white;color:var(--ink);padding:9px 12px}input{width:250px}input:focus,select:focus{outline:2px solid #bbd1c3;outline-offset:1px}.hint{margin-left:auto;font-size:12px;color:var(--muted)}.comparison{overflow-x:auto}.rows{min-width:0}.style-row{padding:0 20px 22px;border-bottom:1px solid var(--line)}.style-row:last-child{border-bottom:0}.row-heading{display:flex;align-items:center;gap:12px;padding:20px 2px 17px}.row-id{font:12px Georgia,serif;color:var(--green)}h2{font-size:16px;font-weight:600;margin:0}.row-note{margin-left:auto;color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}.deck{min-width:0;padding:0 16px;display:flex;flex-direction:column;border-right:1px dashed var(--line)} .deck:nth-child(n+3){padding-top:18px;border-top:1px solid #d9dfdb}.deck[data-variant="original"]{background:#faf9f6}.deck:nth-child(2n+1){padding-left:0}.deck:nth-child(2n){padding-right:0;border-right:0}.deck-heading{display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 15px}.model-tag{font-size:9px;letter-spacing:.5px;background:#edf3ef;color:var(--green);padding:2px 5px;border-radius:3px;font-weight:500}.preview{display:block;padding:0;border:0;background:#f5f6f5;width:100%;line-height:0;cursor:zoom-in;border-radius:2px;overflow:hidden}.preview img{width:100%;height:auto;display:block}.preview:hover{outline:2px solid #bbd1c3;outline-offset:3px}.source{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:12px 0 10px}.deck-footer{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}.page-count{margin-right:auto}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#69977a;margin-right:5px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}[hidden]{display:none!important}.bottom{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin:17px 2px;font-size:11px;color:var(--muted)}
dialog{border:1px solid #ddd;border-radius:6px;padding:0;width:min(1500px,94vw);max-width:94vw;max-height:94vh;background:#fff;color:var(--ink)}dialog::backdrop{background:#17211bcc;backdrop-filter:blur(3px)}.modal-bar{display:flex;align-items:center;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line)}.modal-bar strong{margin-right:auto;font-size:14px}.modal-bar a{font-size:12px}.close{border:1px solid #ddd;background:white;border-radius:4px;padding:5px 10px}.modal-body{overflow:auto;max-height:calc(94vh - 66px);padding:20px;background:#f5f6f5;text-align:center}.modal-body img{display:block;max-width:100%;height:auto;margin:auto;cursor:zoom-in}.modal-body img.full{max-width:none;cursor:zoom-out}.modal-tip{color:var(--muted);font-size:11px}
.zoom{border:1px solid #ddd;background:white;border-radius:4px;padding:5px 10px;cursor:pointer}.modal-body{overscroll-behavior:contain}.modal-bar{position:sticky;top:0;background:white;z-index:1}
@media(max-width:1000px){
 .shell{padding:18px 6px 28px}.masthead{margin:0 4px 16px;display:block}h1{font-size:28px;letter-spacing:-1px;margin-bottom:10px}.subtitle{font-size:11px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px;gap:6px;text-align:left;white-space:normal}.stats strong{font-size:18px}.stats span{font-size:10px}
 .toolbar{padding:10px 8px;gap:6px;display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr)}.toolbar label{font-size:10px}.toolbar input,.toolbar select{width:100%;min-width:0;min-height:44px;padding:6px;font-size:16px}.toolbar>.hint{grid-column:1/-1;width:auto;margin:0;font-size:10px}
 .comparison{overflow:visible}.rows{min-width:0}.style-row{padding:0 5px 16px}.row-heading{padding:14px 0 10px;gap:6px;flex-wrap:wrap}.row-note{width:100%;margin:0;font-size:9px}h2{font-size:15px}.row-id{font-size:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}.deck{padding:0 4px}.deck:nth-child(n+3){padding-top:12px}.deck-heading{flex-wrap:wrap;gap:2px;font-size:10px;line-height:1.4;margin-bottom:6px;min-height:42px;align-content:center;text-align:center}.deck-name{width:100%;white-space:nowrap}.deck-variant{font-size:9px}.deck-variant:before{content:none!important}.heading-pages{font-size:9px!important}.model-tag{display:none}.source{display:none}.deck-footer{gap:2px;flex-wrap:wrap;padding-top:4px;justify-content:center;font-size:9px}.deck-footer a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 2px}.page-count{display:none}.preview:hover{outline:none}.preview{border-radius:0}
 .bottom{display:block;font-size:10px}.bottom span{display:block;margin-bottom:6px}
 dialog{width:100vw;max-width:100vw;height:100vh;height:100dvh;max-height:100dvh;margin:0;border:0;border-radius:0}.modal-bar{padding:10px;gap:8px;flex-wrap:wrap}.modal-bar strong{flex:1 1 calc(100% - 70px);font-size:13px;min-width:0}.close{order:1;min-height:44px;min-width:56px}.modal-bar a{order:3;min-height:44px;display:flex;align-items:center;margin-left:auto}.zoom{order:2;min-height:44px}.modal-tip{display:none}.modal-body{padding:8px;max-height:none;height:calc(100% - 116px)}.modal-body img{touch-action:pan-x pan-y pinch-zoom}
}

.heading-pages{font-size:11px;font-weight:400;color:var(--muted)}.deck-variant:before{content:"· "}
</style>
</head>
<body>
<div class="shell">
 <header class="masthead">
  <div><div class="eyebrow">TEMPLATE BENCHMARK</div><h1>Slide Design Comparison</h1><p class="subtitle">两列：Human 与 AI · 上排骨架，下排原稿与给定素材生成结果</p></div>
  <div class="stats"><div><strong id="style-total"></strong><span>测试风格</span></div><div><strong id="human-total"></strong><span>Human 模板</span></div><div><strong id="model-total"></strong><span>AI 结果</span></div></div>
 </header>
 <main>
  <div class="toolbar"><label for="search">查找</label><input id="search" type="search" placeholder="风格名称或编号" autocomplete="off"><label for="style">显示</label><select id="style"><option value="all">全部风格</option></select><span class="hint" id="result-count" aria-live="polite"></span><span class="hint">上排骨架，下排图文设计 · 点击图片放大细看</span></div>
  <div class="comparison"><div class="rows" id="rows"></div></div><div class="empty" id="empty" hidden>没有匹配的风格，请调整筛选条件。</div>
 </main>
 <footer class="bottom"><span>上排：Human 骨架 / AI 骨架；下排：Human 原图 / AI 给定素材生成。</span><span>AI 使用同页文字、图片与整套风格，不提供整页截图。Human 已补齐字体，部分页面仍有渲染差异。</span></footer>
</div>
<dialog id="viewer" aria-labelledby="viewer-title"><div class="modal-bar"><strong id="viewer-title"></strong><span class="modal-tip">点击图片切换原始尺寸 · Esc 关闭</span><button type="button" class="zoom" id="zoom" aria-pressed="false">放大细看</button><a id="viewer-original" target="_blank" rel="noopener">打开总览 PNG ↗</a><button type="button" class="close" id="close">关闭 ×</button></div><div class="modal-body"><img id="viewer-image" alt=""></div></dialog>
<script>
const data=[{"id": "01", "style": "大胆撞色", "decks": [{"kind": "human", "pages": 24, "source": "Multicolored Geometric Modern Pitch Deck Video Business Presentation", "label": "Human · 骨架", "variant": "skeleton", "image": "01/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "01/generated/overview.png", "pages": 24, "source": "gpt-6-astra"}, {"kind": "human", "pages": 24, "source": "补齐原稿字体后渲染 · Multicolored Geometric Modern Pitch Deck Video Business Presentation", "label": "Human · 原图", "variant": "original", "image": "01/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "01/content_codex/overview.png", "pages": 24, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "02", "style": "未来科技", "decks": [{"kind": "human", "pages": 34, "source": "Black and Blue Tech Theme for Career Day Presentation", "label": "Human · 骨架", "variant": "skeleton", "image": "02/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "02/generated/overview.png", "pages": 34, "source": "gpt-6-astra"}, {"kind": "human", "pages": 34, "source": "补齐原稿字体后渲染 · Black and Blue Tech Theme for Career Day Presentation", "label": "Human · 原图", "variant": "original", "image": "02/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "02/content_codex/overview.png", "pages": 34, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "03", "style": "蓝白商务", "decks": [{"kind": "human", "pages": 21, "source": "Blue and White Simple Basic Company Roadmap Presentation", "label": "Human · 骨架", "variant": "skeleton", "image": "03/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "03/generated/overview.png", "pages": 21, "source": "gpt-6-astra"}, {"kind": "human", "pages": 21, "source": "补齐原稿字体后渲染 · Blue and White Simple Basic Company Roadmap Presentation", "label": "Human · 原图", "variant": "original", "image": "03/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "03/content_codex/overview.png", "pages": 21, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "04", "style": "粉色极简", "decks": [{"kind": "human", "pages": 23, "source": "Pink and Gray Modern Minimalistic Aesthetic Beauty Vlogger CV Marketing Presentation", "label": "Human · 骨架", "variant": "skeleton", "image": "04/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "04/generated/overview.png", "pages": 23, "source": "gpt-6-astra"}, {"kind": "human", "pages": 23, "source": "补齐原稿字体后渲染 · Pink and Gray Modern Minimalistic Aesthetic Beauty Vlogger CV Marketing Presentation", "label": "Human · 原图", "variant": "original", "image": "04/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "04/content_codex/overview.png", "pages": 23, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "05", "style": "黑白极简", "decks": [{"kind": "human", "pages": 25, "source": "Black And White Minimal Architecture Portfolio Presentation", "label": "Human · 骨架", "variant": "skeleton", "image": "05/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "05/generated/overview.png", "pages": 25, "source": "gpt-6-astra"}, {"kind": "human", "pages": 25, "source": "补齐原稿字体后渲染 · Black And White Minimal Architecture Portfolio Presentation", "label": "Human · 原图", "variant": "original", "image": "05/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "05/content_codex/overview.png", "pages": 25, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "06", "style": "霓虹复古", "decks": [{"kind": "human", "pages": 17, "source": "Retro Posting Signs Newsletter ", "label": "Human · 骨架", "variant": "skeleton", "image": "06/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "06/generated/overview.png", "pages": 17, "source": "gpt-6-astra"}, {"kind": "human", "pages": 17, "source": "补齐原稿字体后渲染 · Retro Posting Signs Newsletter ", "label": "Human · 原图", "variant": "original", "image": "06/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "06/content_codex/overview.png", "pages": 17, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "07", "style": "自然植物", "decks": [{"kind": "human", "pages": 28, "source": "Floral Drawings Slides · SlidesCarnival", "label": "Human · 骨架", "variant": "skeleton", "image": "07/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "07/generated/overview.png", "pages": 28, "source": "gpt-6-astra"}, {"kind": "human", "pages": 28, "source": "补齐原稿字体后渲染 · Floral Drawings Slides · SlidesCarnival", "label": "Human · 原图", "variant": "original", "image": "07/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "07/content_codex/overview.png", "pages": 28, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "08", "style": "可爱手绘", "decks": [{"kind": "human", "pages": 28, "source": "Red Blue and Yellow Cute Simple Illustrative Doodles Introducing Myself Creative Presentation · SlidesCarnival", "label": "Human · 骨架", "variant": "skeleton", "image": "08/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "08/generated/overview.png", "pages": 28, "source": "gpt-6-astra"}, {"kind": "human", "pages": 28, "source": "补齐原稿字体后渲染 · Red Blue and Yellow Cute Simple Illustrative Doodles Introducing Myself Creative Presentation · SlidesCarnival", "label": "Human · 原图", "variant": "original", "image": "08/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "08/content_codex/overview.png", "pages": 28, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "09", "style": "金色优雅", "decks": [{"kind": "human", "pages": 22, "source": "Gold Elegant Branding Kit Presentation", "label": "Human · 骨架", "variant": "skeleton", "image": "09/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "09/generated/overview.png", "pages": 22, "source": "gpt-6-astra"}, {"kind": "human", "pages": 22, "source": "补齐原稿字体后渲染 · Gold Elegant Branding Kit Presentation", "label": "Human · 原图", "variant": "original", "image": "09/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "09/content_codex/overview.png", "pages": 22, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}, {"id": "10", "style": "几何抽象", "decks": [{"kind": "human", "pages": 17, "source": "Geometric History of Graphic Design Slides", "label": "Human · 骨架", "variant": "skeleton", "image": "10/human/overview.png"}, {"label": "AI · 骨架", "kind": "codex", "variant": "skeleton", "image": "10/generated/overview.png", "pages": 17, "source": "gpt-6-astra"}, {"kind": "human", "pages": 17, "source": "补齐原稿字体后渲染 · Geometric History of Graphic Design Slides", "label": "Human · 原图", "variant": "original", "image": "10/human/original_overview.png"}, {"label": "AI · 给定素材生成", "kind": "codex", "variant": "generated", "image": "10/content_codex/overview.png", "pages": 17, "source": "gpt-6-astra · Human 01 同页文字、图片与整套风格"}]}];
const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('style-total').textContent=data.length;
const decks=data.flatMap(row=>row.decks);
$('human-total').textContent=decks.filter(deck=>deck.kind==='human'&&deck.variant==='skeleton').length;
$('model-total').textContent=new Set(decks.filter(deck=>deck.kind==='codex').map(deck=>deck.image)).size;
for(const row of data){const option=document.createElement('option');option.value=row.id;option.textContent=`${row.id} ${row.style}`;$('style').append(option)}
$('rows').innerHTML=data.map(row=>`<section class="style-row" data-id="${row.id}" aria-labelledby="style-${row.id}"><div class="row-heading"><span class="row-id">STYLE ${row.id}</span><h2 id="style-${row.id}">${escapeHTML(row.style)}</h2><span class="row-note">Human / AI · 相同页数与素材</span></div><div class="grid">${row.decks.map((deck,i)=>`<article class="deck" data-variant="${deck.variant}"><h3 class="deck-heading"><span class="deck-name">${escapeHTML(deck.label.split(" · ")[0])}</span><span class="deck-variant">${deck.variant==='original'?'原图':deck.variant==='generated'?'给定素材生成':'骨架'}</span><span class="heading-pages">${deck.pages} 页</span>${deck.kind==='codex'?'<span class="model-tag">CODEX</span>':deck.kind==='api'?'<span class="model-tag">OPENROUTER</span>':''}</h3><button class="preview" data-row="${row.id}" data-deck="${i}" aria-label="放大 ${escapeHTML(row.style)} ${deck.label} 总览"><img src="${deck.image}" alt="${escapeHTML(row.style)} · ${deck.label} · ${deck.pages} 页总览" loading="${row.id==='01'?'eager':'lazy'}" decoding="async"></button><p class="source" title="${escapeHTML(deck.source)}">${escapeHTML(deck.source)}</p><div class="deck-footer"><span class="page-count"><span class="dot"></span>${deck.pages} 页</span><a href="${deck.image}" target="_blank" rel="noopener">PNG ↗</a>${deck.pdf?`<a href="${deck.pdf}" target="_blank" rel="noopener">PDF ↗</a>`:''}${deck.pptx?`<a href="${deck.pptx}" download>PPTX ↓</a>`:''}</div></article>`).join('')}</div></section>`).join('');
function filter(){const term=$('search').value.trim().toLowerCase(),style=$('style').value;let count=0;for(const row of data){const visible=(style==='all'||row.id===style)&&`${row.id} ${row.style}`.toLowerCase().includes(term);document.querySelector(`[data-id="${row.id}"]`).hidden=!visible;if(visible)count++}$('empty').hidden=count!==0;$('result-count').textContent=`${count} / ${data.length} 种风格`}
$('search').addEventListener('input',filter);$('style').addEventListener('change',filter);filter();
$('rows').addEventListener('click',event=>{const button=event.target.closest('.preview');if(!button)return;const row=data.find(r=>r.id===button.dataset.row),deck=row.decks[Number(button.dataset.deck)];$('viewer-title').textContent=`${row.id} ${row.style} / ${deck.label} · ${deck.pages} 页`;$('viewer-image').src=deck.image;$('viewer-image').alt=`${row.style} ${deck.label} 总览`;$('viewer-image').classList.remove('full');$('zoom').textContent='放大细看';$('zoom').setAttribute('aria-pressed','false');$('viewer-original').href=deck.image;$('viewer').showModal();document.querySelector('.modal-body').scrollTo(0,0)});
$('close').addEventListener('click',()=>$('viewer').close());$('viewer').addEventListener('click',event=>{if(event.target===$('viewer'))$('viewer').close()});function toggleZoom(){const full=$('viewer-image').classList.toggle('full');$('zoom').textContent=full?'适应屏幕':'放大细看';$('zoom').setAttribute('aria-pressed',String(full))}
$('viewer-image').addEventListener('click',toggleZoom);$('zoom').addEventListener('click',toggleZoom);
</script>
</body>
</html>
