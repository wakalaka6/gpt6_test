<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Benchmark · 图文对比</title>
<style>
:root{color-scheme:light;--ink:#202523;--muted:#808783;--line:#e7eae8;--green:#44735c}
*{box-sizing:border-box}body{margin:0;background:#f4f5f4;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}
button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-underline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:4px}
.shell{max-width:2200px;margin:auto;padding:36px 32px 60px}.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:0 16px 26px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--muted)}h1{font:600 clamp(30px,3.5vw,55px)/1.1 Georgia,"Times New Roman",serif;letter-spacing:-1.8px;margin:9px 0 12px}.subtitle{color:var(--muted);margin:0}.stats{display:flex;gap:34px;text-align:right;white-space:nowrap}.stats strong{display:block;font-size:22px;font-weight:600}.stats span{font-size:12px;color:var(--muted)}
main{background:white;border:1px solid var(--line);border-radius:4px;box-shadow:0 3px 20px #20252303}.toolbar{padding:18px 22px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar label{font-size:12px;color:var(--muted)}input,select{border:1px solid #dfe3e0;border-radius:4px;background:white;color:var(--ink);padding:9px 12px}input{width:250px}input:focus,select:focus{outline:2px solid #bbd1c3;outline-offset:1px}.hint{margin-left:auto;font-size:12px;color:var(--muted)}.comparison{overflow-x:auto}.rows{min-width:0}.style-row{padding:0 20px 22px;border-bottom:1px solid var(--line)}.style-row:last-child{border-bottom:0}.row-heading{display:flex;align-items:center;gap:12px;padding:20px 2px 17px}.row-id{font:12px Georgia,serif;color:var(--green)}h2{font-size:16px;font-weight:600;margin:0}.row-note{margin-left:auto;color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}.deck{min-width:0;padding:0 16px;display:flex;flex-direction:column;border-right:1px dashed var(--line)} .deck:nth-child(n+3){padding-top:18px;border-top:1px solid #d9dfdb}.deck[data-variant="original"]{background:#faf9f6}.deck:nth-child(2n+1){padding-left:0}.deck:nth-child(2n){padding-right:0;border-right:0}.deck-heading{display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 15px}.model-tag{font-size:9px;letter-spacing:.5px;background:#edf3ef;color:var(--green);padding:2px 5px;border-radius:3px;font-weight:500}.preview{display:block;padding:0;border:0;background:#f5f6f5;width:100%;line-height:0;cursor:zoom-in;border-radius:2px;overflow:hidden}.preview img{width:100%;height:auto;display:block}.preview:hover{outline:2px solid #bbd1c3;outline-offset:3px}.source{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:12px 0 10px}.deck-footer{margin-top:auto;padding-top:8px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}.page-count{margin-right:auto}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#69977a;margin-right:5px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}[hidden]{display:none!important}.bottom{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin:17px 2px;font-size:11px;color:var(--muted)}
dialog{border:1px solid #ddd;border-radius:6px;padding:0;width:min(1500px,94vw);max-width:94vw;max-height:94vh;background:#fff;color:var(--ink)}dialog::backdrop{background:#17211bcc;backdrop-filter:blur(3px)}.modal-bar{display:flex;align-items:center;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line)}.modal-bar strong{margin-right:auto;font-size:14px}.modal-bar a{font-size:12px}.close{border:1px solid #ddd;background:white;border-radius:4px;padding:5px 10px}.modal-body{overflow:auto;max-height:calc(94vh - 66px);padding:20px;background:#f5f6f5;text-align:center}.modal-body img{display:block;max-width:100%;height:auto;margin:auto;cursor:zoom-in}.modal-body img.full{max-width:none;cursor:zoom-out}.modal-tip{color:var(--muted);font-size:11px}
.zoom{border:1px solid #ddd;background:white;border-radius:4px;padding:5px 10px;cursor:pointer}.modal-body{overscroll-behavior:contain}.modal-bar{position:sticky;top:0;background:white;z-index:1}
@media(max-width:1000px){
 .shell{padding:18px 6px 28px}.masthead{margin:0 4px 16px;display:block}h1{font-size:28px;letter-spacing:-1px;margin-bottom:10px}.subtitle{font-size:11px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:16px;gap:6px;text-align:left;white-space:normal}.stats strong{font-size:18px}.stats span{font-size:10px}

 .comparison{overflow:visible}.rows{min-width:0}.style-row{padding:0 5px 16px}.row-heading{padding:14px 0 10px;gap:6px;flex-wrap:wrap}.row-note{width:100%;margin:0;font-size:9px}h2{font-size:15px}.row-id{font-size:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:18px}.deck{padding:0 4px}.deck:nth-child(n+3){padding-top:12px}.deck-heading{flex-wrap:wrap;gap:2px;font-size:10px;line-height:1.4;margin-bottom:6px;min-height:42px;align-content:center;text-align:center}.deck-name{width:100%;white-space:nowrap}.deck-variant{font-size:9px}.deck-variant:before{content:none!important}.heading-pages{font-size:9px!important}.model-tag{display:none}.source{display:none}.deck-footer{gap:2px;flex-wrap:wrap;padding-top:4px;justify-content:center;font-size:9px}.deck-footer a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 2px}.page-count{display:none}.preview:hover{outline:none}.preview{border-radius:0}

.view-nav{display:flex;gap:8px;margin:0 16px 24px;flex-wrap:wrap}

.view-nav a[aria-current="page"]{background:var(--green);border-color:var(--green);color:white}
.view-nav a:hover{border-color:var(--green)}
@media(max-width:1000px){.view-nav{margin:0 4px 16px}.view-nav a{flex:1;padding:10px 12px}}
