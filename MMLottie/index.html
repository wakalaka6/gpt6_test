<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MMLottie · GPT-6 合并结果</title>
  <style>
    :root{--bg:#f4f2ec;--paper:#fbfaf6;--ink:#171815;--muted:#686961;--line:#d7d5cd;--soft:#e7e4dd;--green:#335d4e;--pale:#e5eee9}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header,.bar-inner,#results,footer{width:min(1540px,calc(100% - 64px));margin:auto}
    header{padding:62px 0 32px;border-bottom:1px solid var(--line)}.eyebrow{margin-bottom:12px;color:var(--green);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font:500 clamp(36px,5vw,68px)/1.05 Georgia,"Songti SC",serif;letter-spacing:-.035em}.intro{max-width:760px;margin:18px 0 27px;color:var(--muted);font-size:15px;line-height:1.75}.stats{display:flex;flex-wrap:wrap;gap:8px}.stats span{padding:8px 11px;border:1px solid var(--line);border-radius:3px;background:#ffffff70;color:var(--muted);font-size:12px}.stats strong{color:var(--ink)}.stats .model{background:var(--pale);border-color:#c7d7ce}.dot{display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--green)}
    .bar{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:#f4f2ecee;backdrop-filter:blur(12px)}.bar-inner{display:flex;align-items:center;gap:18px;min-height:60px}.bar-label,.count{color:var(--muted);font-size:12px}.filters{display:flex;gap:6px}.filters button{padding:7px 12px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--muted);cursor:pointer}.filters button:hover{border-color:var(--line);color:var(--ink)}.filters button.active{background:var(--ink);color:#fff}.count{margin-left:auto;white-space:nowrap}
    #results{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:28px 0 36px}.sample{display:flex;min-width:0;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:var(--paper)}.sample-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px 8px}.num{margin-right:8px;font:16px Georgia,serif}.badge{color:var(--green);font-size:11px;font-weight:700}.sample-head code{overflow:hidden;max-width:45%;color:#85857e;font-size:9px;text-overflow:ellipsis;white-space:nowrap}.headline-text{min-height:78px;margin:0;padding:0 14px 14px;font:16px/1.55 Georgia,"Songti SC",serif;white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;margin-top:auto;border-top:1px solid var(--soft);background:#fff}.grid.one{grid-template-columns:1fr}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-width:0;margin:0;border-right:1px solid var(--soft)}.card:last-child{border-right:0}.label{min-height:35px;padding:10px 11px;border-bottom:1px solid var(--soft);background:#ffffff70;color:#494a45;font-size:11px;font-weight:700}.stage{display:grid;width:100%;aspect-ratio:1/1;place-items:center;overflow:hidden;background:#fff}.stage img,.stage video{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:center;background:#fff}
    footer{display:flex;justify-content:space-between;padding:30px 0 50px;color:var(--muted);font-size:12px}footer a{color:var(--ink);text-decoration:none}
    @media(max-width:1200px){#results{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:900px){header,.bar-inner,#results,footer{width:min(100% - 32px,760px)}header{padding-top:40px}.bar-inner{gap:8px;overflow:auto}.bar-label{display:none}.filters{flex-shrink:0}#results{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:580px){h1{font-size:38px}#results{grid-template-columns:1fr}.headline-text{min-height:0}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body id="top">
  <header>
    <div class="eyebrow">MMLottie · Qualitative Results</div>
    <h1>GPT-6 Astra 动画生成结果</h1>
    <p class="intro">合并论文展示样例与 MMLottie Bench 测试结果。每个样例直接展示原始 prompt；有参考图或 GT 视频时，与生成结果并排展示。</p>
    <div class="stats"><span><strong>39</strong> 个样例</span><span><strong>14</strong> 文本生成</span><span><strong>14</strong> 图文生成</span><span><strong>11</strong> 视频重建</span><span class="model"><i class="dot"></i><strong>GPT-6 Astra</strong> 39/39</span></div>
  </header>
  <nav class="bar"><div class="bar-inner"><span class="bar-label">任务类型</span><div class="filters"><button class="active" data-filter="all">全部</button><button data-filter="text2lottie">文本生成</button><button data-filter="text_image2lottie">图文生成</button><button data-filter="video2lottie">视频重建</button></div><span class="count" id="count"></span></div></nav>
  <main id="results"></main>
  <footer><span>MMLottie Bench</span><a href="#top">返回顶部 ↑</a></footer>
  <script>
    const rows=[
      ['01_figure4_01','text2lottie','一个风格化显示器图标逐渐出现：白色屏幕、紫色底座和黑色轮廓。'],
      ['02_figure4_02','text2lottie','浅灰色矩形文档轮廓出现，一支黑色铅笔从右侧滑入画面。'],
      ['03_figure4_03','text2lottie','一个带黑色轮廓的黄色圆形表情，眼睛从左向右移动。'],
      ['04_figure4_04','text2lottie','一面装在黄色旗杆上的方格旗轻轻飘动。'],
      ['05_figure4_05','text2lottie','黑白雪球中有一棵卡通圣诞树，雪花在球内飞舞。'],
      ['06_figure4_06','text2lottie','蓝色房屋带黑色烟囱和三扇深色方窗；橙柄白刷子刷出竖直线条。'],
      ['07_figure4_07','text2lottie','蓝色圆角矩形里，一只猫出现并挥手。'],
      ['08_figure4_08','text2lottie','卡通头像留着整齐的棕色短发，黄色脸庞、小耳朵，露出白牙咧嘴微笑。'],
      ['09_figure4_09','text2lottie','一只蓝色小鸟出现，一边脉动一边向下滑动，随后短暂停留。'],
      ['01_8a28d667120d09f048870736a45e405c','text_image2lottie','浅黄色沙漏平滑旋转至竖直，沙粒随之落入下半部，整体逐渐填充为黄色。'],
      ['02_29e9aa253625a744c9e962f6921e708b','text_image2lottie','一条蓝色短线延展成投影屏幕，随后展示饼图、柱状图和灰色文本框。'],
      ['03_801af63abba999888411dd580699fd0c','text_image2lottie','灰色 ATM 机出现，一张青色银行卡从卡槽向下滑出，随后红色定位标记出现。'],
      ['04_5dac6e2aebc3f5119526949aba9f4f0f','text_image2lottie','带精细翅脉的蝴蝶轮廓分三个阶段逐渐加深，最终接近纯黑。'],
      ['05_8b2ae4365e4ff8f1b34f7aca0fa2ee7d','text_image2lottie','写有“41%”的蓝色标牌由模糊变清晰，顶部两个圆角凸起消失。'],
      ['06_724531a5e6b90b1034c172d6bafecb55','text_image2lottie','穿蓝色袖子的手托着带美元符号的黄色硬币，并让硬币平滑翻转。'],
      ['07_583eeb3f9ef19dc26e2c40b361c2534c','text_image2lottie','浅粉色字母 O 逐渐放大，左上方长出红色花朵、粉色花心和绿叶。'],
      ['08_6caf31b7ea63dd69d73be8eb53552f02','text_image2lottie','卡通厨师手持带三个白点的红色聊天气泡；构图保持静止。'],
      ['09_4e35621554c119e1b491c72f0892d52d','text_image2lottie',''],
      ['01_7bfb8dbd60c6ff28142618bbf4203906','video2lottie',''],['02_6d5cbe4b8133b479657ca24210966711','video2lottie',''],['03_adc3f1bd5c3856749b261bd0467aa565','video2lottie',''],['04_53239df6c0996830f2dc048bc974cc92','video2lottie',''],['05_18014d1baa8dfa4d1b3686113183826d','video2lottie',''],['06_a1090da13d756edc9f1807740da8ac3e','video2lottie',''],
      ['01_7d16c88e5c1660145fdfcc86a9c76f77','text2lottie',''],['02_5c63cdee232eb860d7ca31381d267f7f','text2lottie',''],['03_795400a7689e29389782c7acf9c38618','text2lottie',''],['04_af0524433f4ce3cd334fbc3433b9b537','text2lottie',''],['05_56de7180d77cf1e1036d24a5d4e1196b','text2lottie',''],
      ['01_5b369fed548824246e2282fa4c3daf0a','text_image2lottie',''],['02_5a6a50ea945d49fe285919ccc667fc6e','text_image2lottie',''],['03_a89c5b7f9cd2895a35aa4f5db5e28b59','text_image2lottie',''],['04_6b38b3bf3232eb368236a3f00e467a29','text_image2lottie',''],['05_64d613c029dd192ddeb8670715fa2fc6','text_image2lottie',''],
      ['01_090a20b6e2d329f516e1fa9cb2e8526d','video2lottie',''],['02_f2c4c10da8fd5d1b82d177a5fd25927e','video2lottie',''],['03_c91653319b5537435a40dfe5dd8ba149','video2lottie',''],['04_24a78bb5babaebd6bda422042d090711','video2lottie',''],['05_39e8a8a5d4e4a744ba39e41589677a1a','video2lottie','']
    ];
    const names={text2lottie:'文本生成动画',text_image2lottie:'图文生成动画',video2lottie:'视频重建动画'};
    const card=(label,html,extra='')=>`<figure class="card ${extra}"><figcaption class="label">${label}</figcaption>${html}</figure>`;
    function render(filter='all'){
      const shown=rows.filter(r=>filter==='all'||r[1]===filter);
      document.querySelector('#count').textContent=`显示 ${shown.length} / ${rows.length}`;
      document.querySelector('#results').innerHTML=shown.map((r,i)=>{
        const [id,task]=r, base=`./${task}/${id}`, input=base;
        const ref=task==='text_image2lottie'?card('参考图',`<div class="stage"><img loading="lazy" src="${input}/input.png" alt="${id} 参考图"></div>`):'';
        const gt=task==='video2lottie'?card('GT 视频',`<div class="stage"><video src="${input}/input.mp4" muted loop autoplay playsinline controls preload="metadata"></video></div>`):'';
        const result=card('GPT-6 Astra',`<div class="stage"><video src="${base}/result.mp4" muted loop autoplay playsinline controls preload="metadata"></video></div>`);
        const headline=`<p class="headline-text" data-prompt-src="${input}/prompt.txt">正在载入原始 prompt…</p>`;
        const columns=task==='text2lottie'?'one':'two';
        return `<article class="sample"><div class="sample-head"><div><span class="num">${String(i+1).padStart(2,'0')}</span><span class="badge">${names[task]}</span></div><code>${id}</code></div>${headline}<div class="grid ${columns}">${ref}${gt}${result}</div></article>`;
      }).join('');
      document.querySelectorAll('[data-prompt-src]').forEach(async el=>{
        try{
          const response=await fetch(el.dataset.promptSrc);
          if(!response.ok) throw new Error(String(response.status));
          el.textContent=(await response.text()).trim();
        }catch(error){
          el.textContent='原始 prompt 加载失败，请通过 HTTP 服务打开本页面。';
        }
      });
    }
    document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.filters .active').classList.remove('active');b.classList.add('active');render(b.dataset.filter)}));
    render();
  </script>
</body>
</html>
